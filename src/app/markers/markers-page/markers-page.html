<app-map-view
  [draft]="draftPoint()"
  (markerClicked)="onMarkerClicked($event)"
  (mapClicked)="onMapClicked($event)"
></app-map-view>
@if (draft(); as draft) {
  <app-marker-form
    class="sidebar"
    [heading]="draft.mode === 'create' ? 'New marker' : 'Edit marker'"
    [name]="draft.name"
    [latitude]="draft.latitude"
    [longitude]="draft.longitude"
    (saved)="onSaved($event)"
    (cancelled)="onCancelled()"
  ></app-marker-form>
} @else if (selectedMarker()) {
  <app-marker-panel class="sidebar" (edit)="onEdit()"></app-marker-panel>
}
