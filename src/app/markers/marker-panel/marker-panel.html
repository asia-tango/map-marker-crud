@if (marker(); as marker) {
  <button type="button" class="close" aria-label="Close" (click)="close()">×</button>
  <h2>{{ marker.name }}</h2>
  <dl>
    <dt>Latitude</dt>
    <dd>{{ marker.latitude | number: '1.4-4' }}</dd>
    <dt>Longitude</dt>
    <dd>{{ marker.longitude | number: '1.4-4' }}</dd>
  </dl>
}
