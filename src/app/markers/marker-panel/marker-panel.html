@if (marker(); as marker) {
  <button type="button" class="close" aria-label="Close" (click)="close()">×</button>
  <h2>{{ marker.name }}</h2>
  <dl>
    <dt>Latitude</dt>
    <dd>{{ marker.latitude | number: coordinateFormat }}</dd>
    <dt>Longitude</dt>
    <dd>{{ marker.longitude | number: coordinateFormat }}</dd>
  </dl>
  <div class="actions">
    <button type="button" (click)="edit.emit()">Edit</button>
    <button type="button" class="danger" (click)="deleteMarker(marker)">Delete</button>
  </div>
}
